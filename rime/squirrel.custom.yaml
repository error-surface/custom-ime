patch:
  # ── 外观 ──────────────────────────────────────────
  preset_color_schemes:
    solarized_dark:
      name: 曬經・月／Solarized Dark
      author: 雪齋 <lyc20041@gmail.com>
      color_space: srgb
      back_color: '0xF0352A0A'
      hilited_back_color: '0xC9DADF'
      hilited_candidate_back_color: '0x403516'
      preedit_back_color: '0xD7E8ED'
      border_color: '0x2A1F00'
      text_color: '0x756E5D'
      hilited_text_color: '0xBE706D'
      candidate_text_color: '0x7389FF'
      hilited_candidate_text_color: '0x989F52'
      label_color: '0x478DF4'
      hilited_candidate_label_color: '0xCC8947'
      comment_text_color: '0xC38AFF'
      hilited_comment_text_color: '0x289989'
  style:
    color_scheme: solarized_dark
    # 字体: PingFang SC(苹方), HanaMinB(CJK Ext B+回退)
    # HanaMinB 覆盖中日韩扩展B区及以后的生僻字(UTF-8 4字节区),
    # 这是鼠须管内置 luna_pinyin 词库中存在的字符范围
    font_face: "PingFang SC,HanaMinB"
    font_point: 16
    label_font_face: "PingFang SC,HanaMinB"
    label_font_point: 12
    # 候选窗: 横向(horizontal) / 堆叠(stacked)
    candidate_list_layout: stacked
    # 候选显示格式 [序号]. [候选词] [注释]
    candidate_format: "%c %@"
    # 圆角
    corner_radius: 8
    # 行间距
    line_spacing: 4
    # 候选词间距
    spacing: 6
    # 记住窗口位置和大小
    memorize_size: true
    # 内嵌预编辑(光标处显示拼音，而非固定在屏幕底部)
    inline_preedit: true
    # 不显示翻页提示
    show_paging: false
    # 文字方向
    text_orientation: horizontal
    # 候选窗不透明度: false(实色), true(半透明)
    translucency: false
    # 阴影
    shadow_size: 0
    # 边框
    border_height: 0
    border_width: 0
    # 高亮候选圆角
    hilited_corner_radius: 6

  # ── 应用适配 ──────────────────────────────────────
  app_options:
    # 终端保持中文输入(不切ascii)
    com.apple.Terminal:
      ascii_mode: false
    com.googlecode.iterm2:
      ascii_mode: false
    # 代码编辑器自动切ascii
    com.microsoft.VSCode:
      ascii_mode: true
    com.apple.dt.Xcode:
      ascii_mode: true
    com.sublimetext.2:
      ascii_mode: true
    org.vim.MacVim:
      ascii_mode: true
      vim_mode: true
    org.gnu.Emacs:
      ascii_mode: true
    # 浏览器不使用inline模式(候选窗跟随光标)
    com.google.Chrome:
      inline: false
    com.microsoft.edgemac:
      inline: false
    # Alfred/Spotlight强制ascii
    com.alfredapp.Alfred:
      ascii_mode: true
    com.apple.Spotlight:
      ascii_mode: true
    # Telegram使用inline
    ru.keepcoder.Telegram:
      inline: true

  # ── 通知 ──────────────────────────────────────────
  # 状态变化时通知: never / always / appropriate
  show_notifications_when: never

  # ── 快捷键 ────────────────────────────────────────
  # 中文/英文切换快捷键 (Control+Shift+2)
  # 半角/全角切换快捷键 (Control+Shift+3)
  # 简/繁切换快捷键   (Control+Shift+4)
